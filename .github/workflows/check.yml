name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Check formatting
        shell: pwsh
        run: ./raumfeld.ps1 check
      - name: Build
        shell: pwsh
        run: ./raumfeld.ps1 build
      - name: Test
        shell: pwsh
        run: ./raumfeld.ps1 test
